<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>&NewMe Founder Dashboard</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--line:#e4e2dc;
    --red:#d93025;--yellow:#e8a100;--green:#1e8e3e;--redbg:#fdecea;--yellowbg:#fff6df}
  :root[data-theme=dark]{--bg:#141416;--card:#1f1f23;--ink:#f1f1f3;--mut:#9a9aa2;--line:#34343a;--redbg:#3a1f1c;--yellowbg:#3a2f14}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:12px;grid-template-columns:1fr}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{font-size:18px;margin:0}.date{color:var(--mut);font-size:13px}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 8px;display:flex;justify-content:space-between}
  h2 button{font-size:11px;padding:2px 8px;text-transform:none;letter-spacing:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  ol{margin:0;padding-left:20px}li{margin:6px 0}
  [contenteditable]{outline:none;border-radius:4px}[contenteditable]:focus{background:var(--yellowbg)}
  .grid{display:grid;gap:10px;grid-template-columns:1fr}
  .dept{border-left:5px solid var(--line);cursor:pointer;padding:0}
  .dept.red{border-left-color:var(--red)}.dept.yellow{border-left-color:var(--yellow)}.dept.green{border-left-color:var(--green)}
  .dept summary{list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center}
  .dept summary::-webkit-details-marker{display:none}
  .dot{font-size:16px}.nm{font-weight:700;font-size:17px;display:block}.ar{color:var(--mut);font-size:12px;display:block}.cnt{background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:12px;padding:0 7px;color:var(--mut)}.ts{font-size:11.5px;color:var(--mut);margin-top:2px}
  .sm{font-size:13.5px;color:var(--mut)}.chev{margin-left:8px;color:var(--mut);transition:transform .15s}
  .dept[open] .chev{transform:rotate(90deg)}
  .det{padding:0 14px 12px 14px;font-size:14px;border-top:1px solid var(--line)}.det ul{margin:8px 0 0;padding:0;list-style:none}.det li{padding:7px 0;border-bottom:1px solid var(--line)}.det li:last-child{border:0}.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:0 6px;margin-right:6px;background:var(--yellowbg)}.own{background:var(--bg);border:1px solid var(--line)}.upd{color:var(--mut);font-size:12px;margin-top:6px}
  .meet{display:flex;gap:10px;margin:6px 0}.meet b{min-width:46px}.meet small{display:block;color:var(--mut)}
  .alert{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:8px 10px;border-radius:8px;margin:6px 0;background:var(--bg)}
  .alert.red{background:var(--redbg)}.alert.yellow{background:var(--yellowbg)}
  .alert .amt{font-weight:600;white-space:nowrap}.alert small{display:block;color:var(--mut)}
  .err{color:var(--red)}
  @media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){
    main{grid-template-columns:2fr 1fr;align-items:start}
    header,.prio{grid-column:1/-1}
    .grid{grid-template-columns:1fr 1fr}
    aside{display:grid;gap:12px}
  }

  .add{margin-left:6px;padding:0 9px;font-size:16px;line-height:24px;border-radius:12px}
  .det li{display:flex;gap:8px;align-items:flex-start}
  .det li input{margin-top:4px;flex:none}
  .det li.done{opacity:.55}.det li.done .tx{text-decoration:line-through}
  .sub2{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 0 4px}
  .notes{margin:0;padding:0;list-style:none}.notes li{display:block;padding:5px 0;border-bottom:1px solid var(--line)}.notes small{color:var(--mut)}
  .nf{display:flex;gap:6px;margin-top:10px}.nf input{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
    .nd{float:right;border:0;background:none;color:var(--mut);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
  #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  #toast.on{opacity:.95}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>&amp;NewMe · Founder</h1><div class="date" id="date"></div></div>
    <div><button id="gh" aria-label="GitHub token" title="Kayıt ayarı">⚙</button> <button id="theme" aria-label="Tema">🌓</button></div>
  </header>

  <section class="card prio"><h2>Bugünün Top 3 <button id="reset" hidden>sıfırla</button></h2><ol id="prio"></ol></section>

  <section class="grid" id="depts"></section>

  <aside>
    <section class="card"><h2>Bugünkü toplantılar</h2><div id="meet"></div></section>
    <section class="card"><h2>Ödeme uyarıları</h2><div id="cash"></div></section>
    <section class="card" id="reviewCard" hidden><h2>İnceleme bekleyenler</h2><div id="review"></div></section>
  </aside>
</main>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const ICON={red:"🔴",yellow:"🟡",green:"🟢"},ORD={red:0,yellow:1,green:2};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d.split("-").reverse().join(".");
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// theme
const root=document.documentElement;
root.dataset.theme=ls.get("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
$("theme").onclick=()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";ls.set("theme",root.dataset.theme)};

const REPO="ahmetfirat84/founder-dashboard",API="https://api.github.com/repos/"+REPO+"/contents/data.json";
const tok=()=>ls.get("gh_token")||"";
const nowTR=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Istanbul",dateStyle:"short",timeStyle:"short"}).format(new Date());
const b64d=c=>decodeURIComponent(escape(atob(c.replace(/\n/g,""))));
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),3500)};
const ghHead=()=>({Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"});
let D=null;

// token ayarı
$("gh").onclick=()=>{
  const v=prompt("GitHub fine-grained token (yalnız founder-dashboard reposu, Contents: Read and write).\nBoş bırakıp Tamam = token'ı sil.",tok()?"(kayıtlı)":"");
  if(v===null)return;
  if(v.trim()===""||v==="(kayıtlı)"){ if(v.trim()==="")ls.del("gh_token"); }
  else ls.set("gh_token",v.trim());
  location.reload();
};

// veri işlemleri (hem bellekte hem GitHub'daki son sürümde uygulanır)
function applyOp(d,op){
  const dep=d.departments.find(x=>x.key===op.k); if(!dep)return;
  if(op.t==="note"){ dep.notes=dep.notes||[]; dep.notes.unshift({text:op.text,at:op.at}); dep.notes=dep.notes.slice(0,30); }
  if(op.t==="delnote"){ dep.notes=(dep.notes||[]).filter(n=>!(n.text===op.text&&n.at===op.nat)); }
  if(op.t==="done"){
    dep.items=dep.items.map(i=>typeof i==="string"?{text:i}:i);
    const it=dep.items.find(i=>i.text===op.text); if(!it)return;
    if(op.v){it.done=true;it.doneAt=op.at}else{delete it.done;delete it.doneAt}
  }
}
async function commit(op){
  op.at=nowTR(); applyOp(D,op); render();
  if(!tok()){ const q=JSON.parse(ls.get("ops")||"[]"); q.push(op); ls.set("ops",JSON.stringify(q)); toast("Bu cihazda kaydedildi (⚙ ile token girersen data.json'a yazılır)"); return; }
  try{
    const r=await fetch(API+"?t="+Date.now(),{headers:ghHead()}); if(!r.ok)throw new Error("okuma "+r.status);
    const f=await r.json(); const latest=JSON.parse(b64d(f.content)); applyOp(latest,op);
    const p=await fetch(API,{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},
      body:JSON.stringify({message:"Dashboard: "+(op.t==="note"?"not":op.t==="delnote"?"not silindi":"aksiyon")+" "+op.at,content:b64e(JSON.stringify(latest,null,2)+"\n"),sha:f.sha})});
    if(!p.ok)throw new Error("yazma "+p.status);
    toast("data.json'a kaydedildi ✓");
  }catch(e){ toast("Kaydedilemedi: "+e.message+" (token/izin?)"); }
}

async function load(){
  if(tok()){
    const r=await fetch(API+"?t="+Date.now(),{headers:ghHead()});
    if(r.ok){const f=await r.json();return JSON.parse(b64d(f.content));}
  }
  const r=await fetch("data.json?"+Date.now()); if(!r.ok)throw new Error(r.status); return r.json();
}

const ts=t=>{if(!t)return"";const [dt,tm]=t.split(" ");return fmt(dt)+(tm?" "+tm:"")};
const norm=i=>typeof i==="string"?{text:i}:i;

function render(){
  const d=D;
  $("date").textContent=new Date(d.date+"T12:00").toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const openSet=new Set([...document.querySelectorAll("details.dept[open]")].map(e=>e.dataset.k));
  $("depts").innerHTML=d.departments.map(x=>{
    const items=x.items.map(norm), open=items.filter(i=>!i.done), done=items.filter(i=>i.done), notes=(x.notes||[]).slice(0,3);
    const li=i=>`<li class="${i.done?"done":""}"><input type="checkbox" data-k="${esc(x.key)}" data-t="${esc(i.text)}" ${i.done?"checked":""} aria-label="Tamamlandı"><span class="tx">${i.due?`<span class="tag">${esc(i.due)}</span>`:""}${i.owner?`<span class="tag own">${esc(i.owner)}</span>`:""}${esc(i.text)}</span></li>`;
    return `<details class="card dept ${x.status}" data-k="${esc(x.key)}" ${openSet.has(x.key)?"open":""}>
      <summary><span class="dot">${ICON[x.status]}</span>
        <div style="flex:1;min-width:0"><span class="nm">${esc(x.area)}</span><span class="ar">${esc(x.name)}</span>
          <div class="sm">${esc(x.summary)}</div><div class="ts">Son güncelleme: ${esc(ts(x.updated))}</div></div>
        <span class="cnt">${open.length}</span><button class="add" data-add="${esc(x.key)}" aria-label="Not ekle" title="Not ekle">+</button><span class="chev">›</span></summary>
      <div class="det"><ul>${open.map(li).join("")||'<li><span class="tx">Açık aksiyon yok</span></li>'}</ul>
        ${notes.length?`<div class="sub2">Son notlar</div><ul class="notes">${notes.map(n=>`<li><button class="nd" data-del="${esc(x.key)}" data-nat="${esc(n.at)}" data-nt="${esc(n.text)}" aria-label="Notu sil" title="Notu sil">✕</button>${esc(n.text)} <small>· ${esc(ts(n.at))}</small></li>`).join("")}</ul>`:""}
        <form class="nf" data-k="${esc(x.key)}"><input placeholder="Not ekle…" maxlength="300" aria-label="Not"><button>Kaydet</button></form>
        ${done.length?`<div class="sub2">Tamamlananlar (${done.length})</div><ul>${done.map(li).join("")}</ul>`:""}
      </div></details>`;}).join("");

  const rv=d.review||[];$("reviewCard").hidden=!rv.length;
  $("review").innerHTML=rv.map(r=>`<div class="alert"><span>❔</span><div><strong>${esc(r.subject)}</strong><small>${esc(r.from)}${r.note?" · "+esc(r.note):""}</small></div><div></div></div>`).join("");
  $("meet").innerHTML=d.meetings.length?d.meetings.map(m=>`<div class="meet"><b>${esc(m.time)}</b><div>${esc(m.title)}${m.note?`<small>${esc(m.note)}</small>`:""}</div></div>`).join(""):'<span class="date">Bugün toplantı yok</span>';
  $("cash").innerHTML=d.cash_alerts.slice().sort((a,b)=>ORD[a.level]-ORD[b.level]).map(a=>`
    <div class="alert ${a.level}"><span>${ICON[a.level]}</span>
      <div><strong>${esc(a.title)}</strong><small>${esc(a.due)}${a.note?" · "+esc(a.note):""}</small></div>
      <div class="amt">${esc(a.amount)}</div></div>`).join("");
}

// olaylar (delegation)
$("depts").addEventListener("click",e=>{
  const dl=e.target.closest("[data-del]");
  if(dl){ e.preventDefault(); if(confirm("Bu not silinsin mi?")) commit({t:"delnote",k:dl.dataset.del,text:dl.dataset.nt,nat:dl.dataset.nat}); return; }
  const b=e.target.closest("[data-add]"); if(!b)return;
  e.preventDefault(); e.stopPropagation();
  const det=b.closest("details"); det.open=true; det.querySelector(".nf input").focus();
});
$("depts").addEventListener("change",e=>{
  const c=e.target.closest('input[type=checkbox][data-k]'); if(!c)return;
  commit({t:"done",k:c.dataset.k,text:c.dataset.t,v:c.checked});
});
$("depts").addEventListener("submit",e=>{
  const f=e.target.closest("form.nf"); if(!f)return; e.preventDefault();
  const v=f.querySelector("input").value.trim(); if(!v)return;
  commit({t:"note",k:f.dataset.k,text:v});
});

load().then(d=>{
  D=d;
  if(!tok()){ try{JSON.parse(ls.get("ops")||"[]").forEach(op=>applyOp(D,op))}catch(e){} }
  // editable priorities: tarayıcıda saklanır
  const key="prio-"+d.date;
  let saved=null;try{saved=JSON.parse(ls.get(key))}catch(e){}
  const prios=Array.isArray(saved)&&saved.length===3?saved:d.priorities;
  $("prio").innerHTML=prios.map(p=>`<li contenteditable="true" spellcheck="false">${esc(p)}</li>`).join("");
  $("reset").hidden=prios===d.priorities;
  $("prio").addEventListener("input",()=>{
    ls.set(key,JSON.stringify([...document.querySelectorAll("#prio li")].map(li=>li.textContent)));$("reset").hidden=false});
  $("reset").onclick=()=>{ls.del(key);location.reload()};
  render();
}).catch(e=>{$("date").innerHTML=`<span class="err">data.json okunamadı (${esc(e.message)}). Bir sunucudan aç: python3 -m http.server</span>`});
</script>
</body>
</html>
